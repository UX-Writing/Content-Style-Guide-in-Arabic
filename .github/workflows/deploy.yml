name: Deploy

# Builds the site on every push to main and publishes the result to the `site` branch.
# The server pulls the `site` branch every 5 minutes (deploy/csg-deploy.sh), so no
# inbound SSH access to the server is needed. See DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the `site` branch

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    name: Build site and publish to the site branch
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout repository (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history for last-modified dates

      - name: Install Hugo extended
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: hugo --gc --minify --panicOnWarning --destination "$RUNNER_TEMP/public"

      - name: Publish to the site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/public"
          git init --quiet --initial-branch site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Build of ${GITHUB_SHA::7}: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          # A single commit, replaced on every deploy, keeps the branch small
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          echo "Published $(git rev-parse --short HEAD) to the site branch. The server picks it up within 5 minutes."
